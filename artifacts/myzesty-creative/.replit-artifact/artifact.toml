kind = "web"
previewPath = "/"
title = "MyZesty Creative Platform"
description = "A visually rich MyZesty landing page that showcases AI image, video, product promotion, ads, storytelling, and editing capabilities through a dark editorial gallery experience."
version = "1.0.0"
id = "artifacts/myzesty-creative"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21594

[services.development]
run = "pnpm --filter @workspace/myzesty-creative run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myzesty-creative", "run", "build" ]
serve = "static"
publicDir = "artifacts/myzesty-creative/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21594"
BASE_PATH = "/"
